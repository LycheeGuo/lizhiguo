{{/* layouts/partials/site_footer.html */}}

<style>
  @keyframes spread-flow {
    /* 保持：从左向右流动 */
    0% { background-position: 200% 50%; }
    100% { background-position: 0% 50%; }
  }
  
  .creeping-colors {
    /* 颜色顺序调整：
       1. 深紫 (#7e22ce) -> 作为循环的起点和终点
       2. 深宝蓝 (#1d4ed8)
       3. 深森林绿 (#047857)
       4. 深金黄 (#ca8a04) -> ★ 新增：替换了原来的红色，选用了深金色以保证清晰度
       5. 深焦糖橙 (#c2410c)
       6. 回到深紫 (#7e22ce) -> 闭环
    */
    background: linear-gradient(90deg, 
      #7e22ce, /* 深紫 */
      #1d4ed8, /* 深宝蓝 */
      #047857, /* 深森林绿 */
      #ca8a04, /* 深金黄 */
      #c2410c, /* 深焦糖橙 */
      #7e22ce  /* 循环回深紫 */
    );
    
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent; 
    -webkit-text-fill-color: transparent;
    
    animation: spread-flow 10s linear infinite;
  }
</style>

<footer class="mx-auto mt-12 pb-8 max-w-7xl px-6 lg:px-8 text-center">
  
  {{/* 保持之前的间距设置：mb-1 */}}
  <p class="creeping-colors text-sm mb-1">
    {{- with site.Params.footer.copyright.notice -}}
      {{- replace . "{year}" now.Year | markdownify -}}
    {{- end -}}
  </p>
  
  {{/* 保持之前的间距设置：mt-1 */}}
  <div class="mt-1 text-xl select-none cursor-default">
    🍒 ✨ 🪐 🍦 🌈
  </div>
  
</footer>
